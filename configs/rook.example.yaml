# Rook configuration.
#
# Every field is optional - Rook runs with built-in defaults when no config file
# is present. Copy this file to ~/.config/rook/config.yaml (or pass it with
# --config) and adjust as needed.
#
# ENVIRONMENT VARIABLES (no file required - ideal for containers/CI):
# Every scalar field below has a matching env var, ROOK_<PATH>, where PATH is the
# field's path upper-cased with dots as underscores. Env vars override the file.
#   agent.model           -> ROOK_AGENT_MODEL
#   agent.max_iterations  -> ROOK_AGENT_MAX_ITERATIONS
#   default_backend       -> ROOK_DEFAULT_BACKEND
#
# Credentials: put the key DIRECTLY in this file, or reference an environment
# variable with $VAR - either works. There is no single RELAY_API_KEY.
#   relay      -> a per-model provider key, set in this file (see below)
#   cbk        -> CBK_API_SECRET in the environment, or api_secret in this file
#   chatbotkit -> CHATBOTKIT_API_SECRET in the environment, or api_secret here
#                 (cbk and chatbotkit take the same credential value)

agent:
  # Model name that drives the agent, from the ChatBotKit model catalogue and
  # resolved against the selected backend. Open models tend to suit autonomous
  # security work - e.g. glm-5.2 (default), kimi-k3, deepseek-v4-flash.
  model: 'glm-5.2'

  # Safety cap on plan/act/observe cycles before the agent is forced to stop.
  max_iterations: 1000000

# Run artifacts. Every run writes status.json (live state) and events.jsonl (an
# append-only log) into <run_dir>/<runid>/. This is telemetry - what the desktop
# status widget reads - and is separate from the workspace the agent works in.
# Default: $XDG_STATE_HOME/rook/runs (i.e. ~/.local/state/rook/runs).
# run_dir: '~/.local/state/rook/runs'

# Backends are the providers a run can target. Rook ships with three - "relay"
# (CBK Relay), "cbk" (ChatBotKit at api.cbk.ai) and "chatbotkit" (ChatBotKit at
# api.chatbotkit.com). Pick one per run with --backend; otherwise default_backend
# is used. Rook defaults to the relay.
#
# The two ChatBotKit backends authenticate with a Bearer credential (api_secret).
# The relay is different: it authenticates each model with its own provider key,
# carried INSIDE the model string as "<model>/authorization=<key>". So relay auth
# is per model (each model may be a different provider), configured below.
default_backend: relay

backends:
  # relay: CBK Relay. Auth is per model: the key is carried inside the model
  # string as "<model>/authorization=<key>". Put the key directly after
  # `authorization:` (no quotes needed), or reference an env var with $VAR.
  relay:
    # base_url: 'https://relay.cbk.ai'

    # Optional: one default key applied to every relay model that has none.
    # authorization: 'paste-a-key-here-or-$VAR'

    # Per-model provider keys - each open model is a different provider with its
    # own key. `model` aliases a real id; `authorization` is that model's key.
    # The default model is kept ready below - just fill in your key.
    models:
      glm-5.2:
        authorization: '' # <- paste your Z.AI key here
      # kimi-k3:
      #   authorization: ''                   # your Moonshot key
      # deepseek-v4-flash:
      #   authorization: ''                   # your DeepSeek key
      # fast:                                 # a custom alias: rename + cap iterations
      #   model: glm-5-turbo
      #   authorization: ''
      #   max_iterations: 200

  # cbk: ChatBotKit at api.cbk.ai. Bearer credential, defaults to $CBK_API_SECRET.
  cbk:
    # api_secret: '$CBK_API_SECRET'
    # base_url: 'https://api.cbk.ai'
    models: {}

  # chatbotkit: ChatBotKit at api.chatbotkit.com. Same value, its own variable.
  chatbotkit:
    # api_secret: '$CHATBOTKIT_API_SECRET'
    # base_url: 'https://api.chatbotkit.com'
    models: {}

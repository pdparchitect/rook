# Rook terminal: an obsidian canvas, white text, and one crimson accent - the
# red-team signature.
#
# The base includes this file last when it generates kitty.conf, so anything
# kitty understands can be set here - not only colours.

background            #0E0F13
foreground            #F5F6F8
background_opacity    1.0
window_padding_width  14

cursor                #DE3B4B
cursor_text_color     #0E0F13

selection_background  #2A2C34
selection_foreground  #FFFFFF

url_color             #E58A93

active_border_color   #FFFFFF
inactive_border_color #2A2C34
bell_border_color     #FF6B6B

# ANSI, pitched for the obsidian canvas rather than for pure black: the neutrals
# carry most of the interface and red leads the hues, so a coloured token reads
# as deliberate.
color0  #16171C
color8  #6E7280
color1  #DE3B4B
color9  #FF6B6B
color2  #6BD6A8
color10 #8FE6C0
color3  #E0B36A
color11 #F0C98D
color4  #6D9DF0
color12 #93B4F5
color5  #C77DEB
color13 #D9A0F5
color6  #6FD3E0
color14 #93E3EC
color7  #C4C7D0
color15 #FFFFFF

# The shared desktop PS1 requests 256-colour slot 46 for its @user segment.
# Remap that otherwise-neon-green slot to the crimson accent.
color46 #DE3B4B
